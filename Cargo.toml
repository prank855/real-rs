[package]
name = "real-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
build = "build.rs"
description = "Reduce audio latency on Windows 10/11"
license = "MIT"

[[bin]]
name = "real-rs"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

windows-core = "0.62.2"

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
